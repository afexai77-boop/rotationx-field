name: Build AAB
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Generate Keystore and Build
        run: |
          keytool -genkey -v -keystore rotationx.jks -keyalg RSA -keysize 2048 -validity 10000 -storepass RotationX2025! -keypass RotationX2025! -dname "CN=RotationX, OU=Field, O=RotationX, L=Offshore, S=IT, C=IT" -alias rotationx
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew bundleRelease -Pandroid.injected.signing.store.file=$PWD/rotationx.jks -Pandroid.injected.signing.store.password=RotationX2025! -Pandroid.injected.signing.key.alias=rotationx -Pandroid.injected.signing.key.password=RotationX2025!
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
